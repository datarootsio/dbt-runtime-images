name: github-release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, sys
          from pathlib import Path

          version = "${{ steps.ver.outputs.version }}"
          path = Path("CHANGELOG.md")
          if not path.exists():
              print("ERROR: CHANGELOG.md not found", file=sys.stderr)
              sys.exit(1)

          text = path.read_text(encoding="utf-8")

          # Match section starting at: ## [<version>] ... until next ## [ ... or EOF
          pattern = rf"^## \[{re.escape(version)}\].*?$([\s\S]*?)(?=^## \[|\Z)"
          m = re.search(pattern, text, flags=re.MULTILINE)
          if not m:
              print(f"ERROR: Could not find changelog section for [{version}] in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          notes = m.group(0).strip() + "\n"
          Path("release_notes.md").write_text(notes, encoding="utf-8")
          print("Wrote release_notes.md")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.tag }}
          tag_name: ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
