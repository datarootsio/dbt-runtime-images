name: ci-build-test

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: snowflake
            dockerfile: docker/adapters/snowflake/Dockerfile
            image: dbt-runtime-snowflake:ci
            version_arg: DBT_SNOWFLAKE_VERSION
            version_env: DBT_SNOWFLAKE_VERSION
            import_module: dbt.adapters.snowflake

          - name: databricks
            dockerfile: docker/adapters/databricks/Dockerfile
            image: dbt-runtime-databricks:ci
            version_arg: DBT_DATABRICKS_VERSION
            version_env: DBT_DATABRICKS_VERSION
            import_module: dbt.adapters.databricks

          - name: bigquery
            dockerfile: docker/adapters/bigquery/Dockerfile
            image: dbt-runtime-bigquery:ci
            version_arg: DBT_BIGQUERY_VERSION
            version_env: DBT_BIGQUERY_VERSION
            import_module: dbt.adapters.bigquery

          - name: postgres
            dockerfile: docker/adapters/postgres/Dockerfile
            image: dbt-runtime-postgres:ci
            version_arg: DBT_POSTGRES_VERSION
            version_env: DBT_POSTGRES_VERSION
            import_module: dbt.adapters.postgres

          - name: fabric
            dockerfile: docker/adapters/fabric/Dockerfile
            image: dbt-runtime-fabric:ci
            version_arg: DBT_FABRIC_VERSION
            version_env: DBT_FABRIC_VERSION
            import_module: dbt.adapters.fabric

          - name: fabric-samdebruyn
            dockerfile: docker/adapters/fabric-samdebruyn/Dockerfile
            image: dbt-runtime-fabric-samdebruyn:ci
            version_arg: DBT_FABRIC_SAMDEBRUYN_VERSION
            version_env: DBT_FABRIC_SAMDEBRUYN_VERSION
            import_module: dbt.adapters.fabric
            pip_package: dbt-fabric-samdebruyn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load versions
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z0-9_]+=.*$' config/versions.env >> "$GITHUB_ENV"

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "VCS_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SOURCE=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "VERSION=${DBT_CORE_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build base
        run: |
          docker build \
            -f docker/base/Dockerfile \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-base:ci \
            .

      - name: Build core
        run: |
          docker build \
            -f docker/core/Dockerfile \
            --build-arg BASE_IMAGE=dbt-runtime-base:ci \
            --build-arg DBT_CORE_VERSION=${{ env.DBT_CORE_VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-core:ci \
            .

      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="${!{{ matrix.version_env }}}"
          docker build \
            -f "${{ matrix.dockerfile }}" \
            --build-arg CORE_IMAGE=dbt-runtime-core:ci \
            --build-arg "${{ matrix.version_arg }}=${VERSION_VALUE}" \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t "${{ matrix.image }}" \
            .

      - name: Smoke test core (dbt --version)
        if: matrix.name == 'snowflake'
        run: |
          docker run --rm dbt-runtime-core:ci --version

      - name: Smoke test optional package install
        if: matrix.pip_package != ''
        run: |
          docker run --rm --entrypoint bash "${{ matrix.image }}" -lc \
            'python -m pip show "${{ matrix.pip_package }}"'

      - name: Smoke test adapter import
        run: |
          docker run --rm --entrypoint bash "${{ matrix.image }}" -lc \
            'python -c "import ${{ matrix.import_module }}; print(\"ok\")"'

      - name: Smoke test dbt version
        run: |
          docker run --rm "${{ matrix.image }}" --version