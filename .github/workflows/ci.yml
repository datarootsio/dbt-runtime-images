name: ci-build-test

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load versions
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z0-9_]+=.*$' config/versions.env >> "$GITHUB_ENV"

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "VCS_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SOURCE=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "VERSION=${DBT_CORE_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ---------- BASE ----------
      - name: Build base
        run: |
          docker build \
            -f docker/base/Dockerfile \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-base:ci \
            .

      # ---------- CORE ----------
      - name: Build core
        run: |
          docker build \
            -f docker/core/Dockerfile \
            --build-arg BASE_IMAGE=dbt-runtime-base:ci \
            --build-arg DBT_CORE_VERSION=${{ env.DBT_CORE_VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-core:ci \
            .

      # ---------- SNOWFLAKE ----------
      - name: Build snowflake
        run: |
          docker build \
            -f docker/adapters/snowflake/Dockerfile \
            --build-arg CORE_IMAGE=dbt-runtime-core:ci \
            --build-arg DBT_SNOWFLAKE_VERSION=${{ env.DBT_SNOWFLAKE_VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-snowflake:ci \
            .

      # ---------- DATABRICKS ----------
      - name: Build databricks
        run: |
          docker build \
            -f docker/adapters/databricks/Dockerfile \
            --build-arg CORE_IMAGE=dbt-runtime-core:ci \
            --build-arg DBT_DATABRICKS_VERSION=${{ env.DBT_DATABRICKS_VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-databricks:ci \
            .

      # ---------- BIGQUERY ----------
      - name: Build bigquery
        run: |
          docker build \
            -f docker/adapters/bigquery/Dockerfile \
            --build-arg CORE_IMAGE=dbt-runtime-core:ci \
            --build-arg DBT_BIGQUERY_VERSION=${{ env.DBT_BIGQUERY_VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-bigquery:ci \
            .

      # ---------- POSTGRES ----------
      - name: Build postgres
        run: |
          docker build \
            -f docker/adapters/postgres/Dockerfile \
            --build-arg CORE_IMAGE=dbt-runtime-core:ci \
            --build-arg DBT_POSTGRES_VERSION=${{ env.DBT_POSTGRES_VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-postgres:ci \
            .

      # ---------- FABRIC ----------
      - name: Build fabric
        run: |
          docker build \
            -f docker/adapters/fabric/Dockerfile \
            --build-arg CORE_IMAGE=dbt-runtime-core:ci \
            --build-arg DBT_FABRIC_VERSION=${{ env.DBT_FABRIC_VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VCS_REF=${{ env.VCS_REF }} \
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }} \
            --build-arg SOURCE=${{ env.SOURCE }} \
            -t dbt-runtime-fabric:ci \
            .

      # ---------- SMOKE TESTS ----------
      - name: Smoke test core (dbt --version)
        run: |
          docker run --rm dbt-runtime-core:ci --version

      - name: Smoke test snowflake adapter import
        run: |
          docker run --rm --entrypoint bash dbt-runtime-snowflake:ci -lc \
            'python -c "import dbt.adapters.snowflake; print(\"ok\")"'

      - name: Smoke test databricks adapter import
        run: |
          docker run --rm --entrypoint bash dbt-runtime-databricks:ci -lc \
            'python -c "import dbt.adapters.databricks; print(\"ok\")"'

      - name: Smoke test bigquery adapter import
        run: |
          docker run --rm --entrypoint bash dbt-runtime-bigquery:ci -lc \
            'python -c "import dbt.adapters.bigquery; print(\"ok\")"'

      - name: Smoke test postgres adapter import
        run: |
          docker run --rm --entrypoint bash dbt-runtime-postgres:ci -lc \
            'python -c "import dbt.adapters.postgres; print(\"ok\")"'

      - name: Smoke test fabric adapter import
        run: |
          docker run --rm --entrypoint bash dbt-runtime-fabric:ci -lc \
            'python -c "import dbt.adapters.fabric; print(\"ok\")"'