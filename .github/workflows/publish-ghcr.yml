name: publish-images-ghcr

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: snowflake
            dockerfile: docker/adapters/snowflake/Dockerfile
            image_name: dbt-runtime-snowflake
            adapter_version: ${{ vars.DBT_SNOWFLAKE_VERSION || '' }}
            adapter_version_env: DBT_SNOWFLAKE_VERSION
            adapter_build_arg: DBT_SNOWFLAKE_VERSION
            import_module: dbt.adapters.snowflake

          - name: databricks
            dockerfile: docker/adapters/databricks/Dockerfile
            image_name: dbt-runtime-databricks
            adapter_version: ${{ vars.DBT_DATABRICKS_VERSION || '' }}
            adapter_version_env: DBT_DATABRICKS_VERSION
            adapter_build_arg: DBT_DATABRICKS_VERSION
            import_module: dbt.adapters.databricks

          - name: bigquery
            dockerfile: docker/adapters/bigquery/Dockerfile
            image_name: dbt-runtime-bigquery
            adapter_version: ${{ vars.DBT_BIGQUERY_VERSION || '' }}
            adapter_version_env: DBT_BIGQUERY_VERSION
            adapter_build_arg: DBT_BIGQUERY_VERSION
            import_module: dbt.adapters.bigquery

          - name: postgres
            dockerfile: docker/adapters/postgres/Dockerfile
            image_name: dbt-runtime-postgres
            adapter_version: ${{ vars.DBT_POSTGRES_VERSION || '' }}
            adapter_version_env: DBT_POSTGRES_VERSION
            adapter_build_arg: DBT_POSTGRES_VERSION
            import_module: dbt.adapters.postgres

          - name: fabric
            dockerfile: docker/adapters/fabric/Dockerfile
            image_name: dbt-runtime-fabric
            adapter_version: ${{ vars.DBT_FABRIC_VERSION || '' }}
            adapter_version_env: DBT_FABRIC_VERSION
            adapter_build_arg: DBT_FABRIC_VERSION
            import_module: dbt.adapters.fabric

          - name: fabric-samdebruyn
            dockerfile: docker/adapters/fabric-samdebruyn/Dockerfile
            image_name: dbt-runtime-fabric-samdebruyn
            adapter_version: ${{ vars.DBT_FABRIC_SAMDEBRUYN_VERSION || '' }}
            adapter_version_env: DBT_FABRIC_SAMDEBRUYN_VERSION
            adapter_build_arg: DBT_FABRIC_SAMDEBRUYN_VERSION
            import_module: dbt.adapters.fabric
            pip_package: dbt-fabric-samdebruyn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load versions
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z0-9_]+=.*$' config/versions.env >> "$GITHUB_ENV"

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "VCS_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SOURCE=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "VERSION=${DBT_CORE_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          build-args: |
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ env.VCS_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=${{ env.SOURCE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-base:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-base:${{ env.DBT_CORE_VERSION }}

      - name: Build & push core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/core/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-base:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            DBT_CORE_VERSION=${{ env.DBT_CORE_VERSION }}
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ env.VCS_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=${{ env.SOURCE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            CORE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ matrix.adapter_build_arg }}=${{ env[matrix.adapter_version_env] }}
            VERSION=${{ env[matrix.adapter_version_env] }}
            VCS_REF=${{ env.VCS_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=${{ env.SOURCE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}:${{ env[matrix.adapter_version_env] }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}:${{ env[matrix.adapter_version_env] }}

      - name: Smoke test core
        if: matrix.name == 'snowflake'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }} \
            --version

      - name: Smoke test optional package install
        if: matrix.pip_package != ''
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}:${{ env[matrix.adapter_version_env] }}-${{ github.sha }} \
            -lc 'python -m pip show "${{ matrix.pip_package }}"'

      - name: Smoke test adapter import
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}:${{ env[matrix.adapter_version_env] }}-${{ github.sha }} \
            -lc 'python -c "import ${{ matrix.import_module }}; print(\"ok\")"'

      - name: Smoke test dbt version
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}:${{ env[matrix.adapter_version_env] }}-${{ github.sha }} \
            --version
