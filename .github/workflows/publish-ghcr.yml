name: publish-images-ghcr

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load versions
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z0-9_]+=.*$' config/versions.env >> "$GITHUB_ENV"

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- BASE ----------
      - name: Build & push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          build-args: |
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-base:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-base:${{ env.DBT_CORE_VERSION }}

      # ---------- CORE ----------
      - name: Build & push core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/core/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-base:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            DBT_CORE_VERSION=${{ env.DBT_CORE_VERSION }}
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}

      # ---------- SNOWFLAKE ----------
      - name: Build & push snowflake
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/adapters/snowflake/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=snowflake
          cache-to: type=gha,mode=max,scope=snowflake
          build-args: |
            CORE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            DBT_SNOWFLAKE_VERSION=${{ env.DBT_SNOWFLAKE_VERSION }}
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-snowflake:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-snowflake:${{ env.DBT_CORE_VERSION }}

      # ---------- DATABRICKS ----------
      - name: Build & push databricks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/adapters/databricks/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=databricks
          cache-to: type=gha,mode=max,scope=databricks
          build-args: |
            CORE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            DBT_DATABRICKS_VERSION=${{ env.DBT_DATABRICKS_VERSION }}
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-databricks:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-databricks:${{ env.DBT_CORE_VERSION }}

      # ---------- BIGQUERY ----------
      - name: Build & push bigquery
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/adapters/bigquery/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=bigquery
          cache-to: type=gha,mode=max,scope=bigquery
          build-args: |
            CORE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            DBT_BIGQUERY_VERSION=${{ env.DBT_BIGQUERY_VERSION }}
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-bigquery:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-bigquery:${{ env.DBT_CORE_VERSION }}

      # ---------- POSTGRES ----------
      - name: Build & push postgres
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/adapters/postgres/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
          build-args: |
            CORE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            DBT_POSTGRES_VERSION=${{ env.DBT_POSTGRES_VERSION }}
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-postgres:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-postgres:${{ env.DBT_CORE_VERSION }}

      # ---------- FABRIC ----------
      - name: Build & push fabric
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/adapters/fabric/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=fabric
          cache-to: type=gha,mode=max,scope=fabric
          build-args: |
            CORE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            DBT_FABRIC_VERSION=${{ env.DBT_FABRIC_VERSION }}
            VERSION=${{ env.DBT_CORE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-fabric:${{ env.DBT_CORE_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-fabric:${{ env.DBT_CORE_VERSION }}

      # ---------- FABRIC-SAMDEBRUYN ----------
      - name: Build & push fabric-samdebruyn
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/adapters/fabric-samdebruyn/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=fabric
          cache-to: type=gha,mode=max,scope=fabric
          build-args: |
            CORE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_FABRIC_SAMDEBRUYN_VERSION }}-${{ github.sha }}
            DBT_FABRIC_VERSION=${{ env.DBT_FABRIC_SAMDEBRUYN_VERSION }}
            VERSION=${{ env.DBT_FABRIC_SAMDEBRUYN_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-fabric-samdebruyn:${{ env.DBT_FABRIC_SAMDEBRUYN_VERSION }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-fabric-samdebruyn:${{ env.DBT_FABRIC_SAMDEBRUYN_VERSION }}

      # ---------- SMOKE TESTS (published immutable tags) ----------
      - name: Smoke test core
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-core:${{ env.DBT_CORE_VERSION }}-${{ github.sha }} \
            --version

      - name: Smoke test snowflake adapter import
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-snowflake:${{ env.DBT_CORE_VERSION }}-${{ github.sha }} \
            -lc 'python -c "import dbt.adapters.snowflake; print(\"ok\")"'

      - name: Smoke test databricks adapter import
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-databricks:${{ env.DBT_CORE_VERSION }}-${{ github.sha }} \
            -lc 'python -c "import dbt.adapters.databricks; print(\"ok\")"'

      - name: Smoke test bigquery adapter import
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-bigquery:${{ env.DBT_CORE_VERSION }}-${{ github.sha }} \
            -lc 'python -c "import dbt.adapters.bigquery; print(\"ok\")"'

      - name: Smoke test postgres adapter import
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-postgres:${{ env.DBT_CORE_VERSION }}-${{ github.sha }} \
            -lc 'python -c "import dbt.adapters.postgres; print(\"ok\")"'

      - name: Smoke test fabric adapter import
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-fabric:${{ env.DBT_CORE_VERSION }}-${{ github.sha }} \
            -lc 'python -c "import dbt.adapters.fabric; print(\"ok\")"'

      - name: Smoke test fabric-samdebruyn adapter import
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dbt-runtime-fabric-samdebruyn:${{ env.DBT_FABRIC_SAMDEBRUYN_VERSION }}-${{ github.sha }} \
            -lc 'python -c "import dbt.adapters.fabric_samdebruyn; print(\"ok\")"'